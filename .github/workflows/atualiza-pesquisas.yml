name: Atualiza pesquisas

on:
  workflow_dispatch:
  schedule:
    - cron: "15 11 * * *"

permissions:
  contents: write

concurrency:
  group: atualiza-pesquisas
  cancel-in-progress: false

jobs:
  coleta:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Testar coletor presidencial
        run: node scripts/teste.mjs

      - name: Testar coletor de governadores
        run: node scripts/teste-governadores.mjs

      - name: Atualizar presidente
        run: node scripts/coleta.mjs

      - name: Atualizar governadores
        run: node scripts/coleta-governadores.mjs

      - name: Limpar histórico estadual
        run: node scripts/normaliza-historico-governadores.mjs

      - name: Atualizar extras sem derrubar o principal
        continue-on-error: true
        run: node scripts/extras.mjs

      - name: Publicar dados atualizados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados/
          if git diff --cached --quiet; then
            echo "Nenhuma mudança nos dados."
            exit 0
          fi
          git commit -m "dados: atualiza pesquisas $(date -u +%F)"
          git push
